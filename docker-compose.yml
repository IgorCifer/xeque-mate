# Local development database only. Credentials are not secret.
# DATABASE_URL=postgresql://xequemate:xequemate@localhost:5432/xequemate
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xequemate
      POSTGRES_PASSWORD: xequemate
      POSTGRES_DB: xequemate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xequemate -d xequemate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
